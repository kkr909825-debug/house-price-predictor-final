<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House Price Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>House Price Predictor</h1>
    <p>Choose a city and location, enter the details and get the estimated price.</p>
  </header>

  <main>
    <form id="form">
      <h2>Where is the house?</h2>
      <div class="grid">
        <label>City
          <select name="city" id="city"></select>
        </label>
        <label>Location
          <select name="location" id="location"></select>
        </label>
      </div>

      <h2>About the house</h2>
      <div class="grid">
        <label>Size (sq ft)
          <input type="number" name="area_sqft" value="1000" min="200" max="10000">
        </label>
        <label>Bedrooms
          <input type="number" name="bedrooms" value="2" min="1" max="10">
        </label>
        <label>House status
          <select name="resale">
            <option value="new">New</option>
            <option value="resale">Resale</option>
          </select>
        </label>
      </div>

      <h2>Facilities</h2>
      <div class="grid" id="facilities"></div>

      <button type="submit" id="button">Predict price</button>
      <p id="error" class="error"></p>
    </form>

    <section id="result">
      <p id="message">Your predicted price will show here.</p>
      <div id="answer" hidden>
        <p class="small">Estimated price</p>
        <p class="price" id="price"></p>
        <p class="small" id="persqft"></p>
        <p class="small" id="range"></p>
      </div>
      <p class="small" id="modelinfo"></p>
    </section>
  </main>

  <footer>This is only an estimate and not an official valuation.</footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
